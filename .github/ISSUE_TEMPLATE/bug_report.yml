name: "🐛 Bug Report"
description: "File an issue about a bug or unexpected behavior in SoloWander"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this issue! Please provide as much information as possible.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what went wrong...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Workspace / Component
      options:
        - Web App (apps/web)
        - Safety & SOS Dispatch
        - Supabase & Auth
        - Monorepo / CI/CD
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment & Additional Context
      description: Browser version, OS, Node.js version, device model, console errors, etc.
