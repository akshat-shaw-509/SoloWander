name: "✨ Feature Request"
description: "Suggest an idea or enhancement for SoloWander"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We love ideas! Please describe the feature you'd like to see in SoloWander.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: I am always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you considered.
  - type: dropdown
    id: component
    attributes:
      label: Target Component
      options:
        - Web App (apps/web)
        - Mobile App (apps/mobile)
        - Safety & Offline SOS
        - Community & Reviews
        - Expense & Affordability Engine
